services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sports:sports@db:5432/sports

  worker:
    build: .
    command: python -m app.workers.predict_worker
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://sports:sports@db:5432/sports

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
